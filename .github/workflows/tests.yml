name: Tests

# The backend suite on SQLite and on PostgreSQL 16, plus the startup chain (migrations,
# seeds, schema check) on both: on a new database, a second time on the same one, and as an
# upgrade of a database built by main. No secrets and no provider keys: every model call
# and every outside service is mocked, and the suite refuses any network connection.
on:
  pull_request:
  push:
    # main, and the phase branches the work is built on (so a phase is checked on
    # PostgreSQL before its pull request is opened)
    branches: [main, "phase-*"]
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt pytest==8.3.3
      - name: Startup chain on a new database, twice
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_startup.db
        run: |
          python -c "import asyncio, main; asyncio.run(main.startup())"
          python -c "import asyncio, main; asyncio.run(main.startup())"
      - name: Suite
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      DB_BASE: postgresql://founder:founder@localhost:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt pytest==8.3.3
      - name: A role that is not a superuser, and three throwaway databases
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT version();
          CREATE ROLE founder LOGIN PASSWORD 'founder';
          CREATE DATABASE founder_fresh OWNER founder;
          CREATE DATABASE founder_upgrade OWNER founder;
          CREATE DATABASE founder_test OWNER founder;
          SQL
      - name: Startup chain on a new database, twice
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DB_BASE }}/founder_fresh
        run: |
          python -c "import asyncio, main; asyncio.run(main.startup())"
          python -c "import asyncio, main; asyncio.run(main.startup())"
      - name: Upgrade a database built by main, twice
        env:
          DATABASE_URL: ${{ env.DB_BASE }}/founder_upgrade
        run: |
          git worktree add ../main-src origin/main
          (cd ../main-src/backend && python -c "import asyncio, main; asyncio.run(main.startup())")
          cd backend
          python -c "import asyncio, main; asyncio.run(main.startup())"
          python -c "import asyncio, main; asyncio.run(main.startup())"
      - name: Row-level security is on for every Phase 7 table, on both databases
        env:
          PGPASSWORD: founder
        run: |
          for database in founder_fresh founder_upgrade; do
            found=$(psql -h localhost -U founder -d "$database" -At -c "
              SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relrowsecurity
                AND c.relname IN ('model_routes', 'model_prices', 'buckets', 'ledger_transactions',
                                  'allocation_rules', 'vault_exports', 'push_subscriptions')")
            if [ "$found" != "7" ]; then echo "$database: row-level security is on for $found of 7 Phase 7 tables"; exit 1; fi
          done
          echo "Row-level security is on for all seven Phase 7 tables on both databases."
      - name: The upgrade seeded the routes and moved the notification defaults, and kept what was there
        env:
          PGPASSWORD: founder
        run: |
          got=$(psql -h localhost -U founder -d founder_upgrade -At -c "
            SELECT (SELECT count(*) FROM model_routes) || '|' || (SELECT count(*) FROM model_prices WHERE confirmed)
                || '|' || morning_time || '|' || evening_time || '|' || deadline_days_json
            FROM notification_settings WHERE id = 1")
          echo "$got"
          [ "$got" = "12|8|05:45|19:45|[7, 3, 1]" ]
      - name: Suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ env.DB_BASE }}/founder_test
        run: python -m pytest -q -p no:cacheprovider
